
<html>
<head>
    <title>Pesona Kerinci</title>

    <style>
        /* Mengatur gambar latar halaman */
        body {
            margin: 0;
            height: 100vh;
            background: url("GUNUNG KERINCI.webp") center 25%/cover no-repeat;
            font-family: Arial, sans-serif;
        }

        /* Memberi lapisan gelap pada gambar */
        .overlay {
            height: 100vh;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Membuat kotak informasi di tengah */
        .kotak {
            width: 550px;
            padding: 40px;
            text-align: center;
            background: rgba(255, 255, 255, 0.78);
            border-radius: 25px;
            box-shadow: 0 15px 40px #0005;
        }

        /* Mengatur tampilan tulisan */
        .label { color: #2e6b3e; letter-spacing: 3px; }
        h1 { color: #17251b; font-size: 48px; margin: 15px 0; }
        h2 { color: #2e6b3e; font-weight: normal; }
        p { color: #333; line-height: 1.6; }

        /* Mengatur tampilan tombol */
        .tombol {
            display: inline-block;
            margin-top: 15px;
            padding: 14px 30px;
            background: #2e6b3e;
            color: white;
            text-decoration: none;
            border-radius: 30px;
        }

        /* Efek ketika kursor berada di atas tombol */
        .tombol:hover { background: #1f4d2c; }
    </style>
</head>

<body>
    <div class="overlay">
        <div class="kotak">

            <div class="label">PROVINSI JAMBI</div>

            <h1>PESONA KERINCI</h1>
            <h2>Menjelajah Kerinci melalui Data</h2>

            <p>
                Mengenal wilayah, penduduk, dan karakteristik
                Kabupaten Kerinci melalui informasi dan data.
            </p>

            <!-- Klik tombol untuk membuka halaman INDEX.html.html -->
            <a class="tombol" href="index.html">
                JELAJAHI KERINCI →
            </a>

            <p>Statistik Kabupaten Kerinci</p>

        </div>
    </div>
</body>
</html>
